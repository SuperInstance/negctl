name: negative control
# A conformance suite that cannot fail is not evidence.
# This workflow sabotages a port, REQUIRES the suite to fail, restores it, and
# requires it to pass again. Nine green suites in this project could not fail
# before this existed.
on:
  schedule: [{ cron: "41 5 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/run.mjs'
      - '**/wrappers/**'
      - '**/cases.json'
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - name: clone the ports and suites as siblings
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/git.pp-doctor          ../gitpp-doctor
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-js              ../gitpp-js
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-cs             ../gitpp-cs
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-pl             ../gitpp-pl
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-c              ../gitpp-c
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-fold-conformance ../gitpp-fold-conformance
          # main predates the comparator fix. A control run against main
          # would test the old harness -- the one whose comparison cannot
          # fail -- so it would verify nothing.
          git -C ../gitpp-fold-conformance fetch --depth 1 origin fix/second-blind-spot
          git -C ../gitpp-fold-conformance checkout FETCH_HEAD
      - name: build the C# wrapper
        working-directory: ../gitpp-fold-conformance
        run: dotnet build wrappers/CsDerive
      - name: build the C port from source
        # The C participant was CLONED but never BUILT, and GITPP_C_BIN was
        # never set -- so the wrapper fell back to /tmp/gitpp-c-derive, which
        # does not exist on a fresh runner. The C port therefore errored on
        # every case, and the baseline never passed:
        #
        #   NEGATIVE CONTROL FAILED -- the suite cannot be trusted to pass
        #   reason: baseline suite does not pass; fix that first
        #
        # That is negctl WORKING -- it refused to certify a suite whose
        # baseline was broken. But the baseline was broken for a boring
        # reason, and a control that can never start proves nothing.
        #
        # BUILD FROM SOURCE, do not trust the committed binary. The repo
        # ships a prebuilt `gitpp`, and a stale committed binary would test
        # the wrong build -- the same trap CDerive.sh documents.
        working-directory: ../gitpp-c
        run: |
          make clean
          make
          test -x ./gitpp
          echo "GITPP_C_BIN=$GITHUB_WORKSPACE/gitpp-c/gitpp" >> $GITHUB_ENV
      - name: every participant must be present and runnable
        # A participant that cannot run must be a FAILURE, not a silently
        # smaller set -- a run over four ports reports the same pass count
        # as a run over five.
        run: |
          test -f ../gitpp-doctor/gitpp_doctor.py
          test -f ../gitpp-js/src/gitpp.js
          test -f ../gitpp-pl/lib/Gitpp.pm
          test -f ../gitpp-c/gitpp
          test -f ../gitpp-fold-conformance/wrappers/CsDerive/bin/Debug/net9.0/CsDerive.dll
          echo "all five participants are present" 
      - name: the control must pass, or the suite is untrustworthy
        run: |
          cd ../negctl
          NEGCTL_ROOT=.. node negctl.mjs
